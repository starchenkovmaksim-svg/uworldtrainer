<!doctype html><html lang="ru" data-skin="vanessa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Проверка Ванессы</title><link rel="stylesheet" href="exam.css"><link rel="stylesheet" href="trainer-ux.css"><link rel="stylesheet" href="trainer-comfort.css"><link rel="stylesheet" href="vanessa.css?v=20261011-goal1"><script src="trainer-theme.js?v=20261011-vanessa1"></script></head><body><main class="app"><header class="top"><h1>Проверка Ванессы</h1><button class="btn theme-toggle">Сменить освещение</button><button class="btn" id="accountOpen">Настройки</button></header><nav class="section-nav">Изолированная проверка · учебный прогресс не используется</nav><div class="card pad"><p>Эти кнопки проверяют только помощницу. Дневной счётчик теста хранится отдельно от гостя и аккаунтов.</p><button class="btn" id="correct">Проверенный верный ответ</button><button class="btn" id="wrong">Проверенный неверный ответ</button><button class="btn" id="repeat">Повторить тот же ответ</button><button class="btn" id="rest">Перерыв</button><button class="btn" id="focus">Экзаменационный блок</button><button class="btn" id="finish">Завершить занятие</button></div><dialog id="accountDialog"><button id="close">Закрыть</button><button data-account-tab="settings">Настройки</button><section id="account-settings"></section></dialog></main><script>
window.trainer={cloudUser:'vanessa-preview-only'};
document.getElementById('accountOpen').onclick=()=>document.getElementById('accountDialog').showModal();
document.getElementById('close').onclick=()=>document.getElementById('accountDialog').close();
document.querySelector('.theme-toggle').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
document.documentElement.dataset.skin='vanessa';
let serial=Date.now(),last='preview-first';
document.getElementById('correct').onclick=()=>{last='preview-'+(++serial);window.Vanessa.answered(last,true);};
document.getElementById('wrong').onclick=()=>{last='preview-'+(++serial);window.Vanessa.answered(last,false);};
document.getElementById('repeat').onclick=()=>window.Vanessa.answered(last,true);
document.getElementById('rest').onclick=()=>window.Vanessa.context('break');
document.getElementById('focus').onclick=()=>window.Vanessa.context('block');
document.getElementById('finish').onclick=()=>window.Vanessa.completed();
</script><script src="vanessa-daily.js?v=20261011-goal1"></script><script src="vanessa.js?v=20261011-goal2"></script></body></html>
